 }else if(methodChosen==='share'){
  if(navigator.share){navigator.share({title:'GoFerry Travel Match',text:msg,url:link}).catch(()=>{});}

 }else if(methodChosen==='email'&&dest){location.href='mailto:'+encodeURIComponent(dest)+'?subject='+encodeURIComponent('GoFerry Travel Match')+'&body='+encodeURIComponent(msg);}
 else if(methodChosen==='sms'&&dest){location.href='sms:'+encodeURIComponent(dest)+'?body='+encodeURIComponent(msg);}
 session.answers=Array(8).fill(null);session.departurePort=null;session.step=0;session.role='host';trackEvent('quiz_started',{role:'host'});navigation('quiz');

const PORT_OPTIONS=[['Piraeus','Rafina','Lavrio'],['Thessaloniki','Volos','Agios Konstantinos','Igoumenitsa','Patras','Kyllini','Kavala','Other Greek port'],['Ancona','Bari','Brindisi','Venice','Other Italian port']];

async function claimCoupon(){const email=document.getElementById('couponEmail')?.value.trim()||'',marketing=!!document.getElementById('marketingConsent')?.checked,status=document.getElementById('claimStatus');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){if(status)status.textContent='Please enter a valid email address.';return}session.email=email;session.marketing=marketing;session.couponClaimed=true;if(status)status.textContent='Registering your demo coupon…';if(session.remote){try{await rpc('tm_save_email',{p_token:session.id,p_role:session.role,p_email:email,p_marketing:marketing});await rpc('tm_link_identity',{p_visitor_id:visitorId,p_email:email});trackEvent('coupon_claimed',{role:session.role,marketing_consent:marketing})}catch(e){session.syncError='The email could not be synchronized yet.'}}save();navigation('done')}

 if(score!==null){html+=`<div id="confettiRain" class="confetti-rain" aria-hidden="true"></div><div class="resultcard"><div class="eyebrow">TRAVEL COMPATIBILITY</div><div id="matchScore" class="stat">0%</div><div class="result-message">${resultMessage(score)}</div><p class="result-cta">Download the GoFerry app and enter the draw for free ferry tickets and more travel gifts!</p><button class="primary" onclick="appComingSoon()">Download the GoFerry app</button><div id="appStatus" class="feedback"></div></div>`;}

async function refreshMatchStatus(){if(!session.remote||!session.id||session.phase!=='done')return;try{const status=await rpc('tm_status',{p_token:session.id});if(Number.isInteger(status?.score)){session.remoteScore=status.score;session.syncError='';save();render();return}}catch(e){session.syncError='Waiting for the online match service…'}scheduleStatusPoll()}

function launchConfettiRain(){const rain=document.getElementById('confettiRain');if(!rain||rain.childElementCount)return;const symbols=['🎊','🎉','✨','●','◆','▰'],colors=['#ffce56','#ff6b6b','#52d3c4','#51a8ff','#b982ff','#ff8a3d'];for(let i=0;i<58;i++){const piece=document.createElement('span');piece.className='confetti-piece';piece.textContent=symbols[Math.floor(Math.random()*symbols.length)];piece.style.color=colors[Math.floor(Math.random()*colors.length)];piece.style.setProperty('--x',(Math.random()*100).toFixed(1)+'vw');piece.style.setProperty('--size',(11+Math.random()*15).toFixed(0)+'px');piece.style.setProperty('--duration',(2.2+Math.random()*1.8).toFixed(2)+'s');piece.style.setProperty('--delay',(Math.random()*.9).toFixed(2)+'s');piece.style.setProperty('--drift',(-70+Math.random()*140).toFixed(0)+'px');piece.style.setProperty('--spin',(-720+Math.random()*1440).toFixed(0)+'deg');rain.appendChild(piece)}setTimeout(()=>rain.remove(),5200)}

function drawRock(ctx,x,y,r){
 ctx.save();ctx.translate(x,y);ctx.fillStyle='#157e90';ctx.beginPath();ctx.ellipse(0,9,r*1.35,r*.75,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#758b8d';ctx.beginPath();ctx.moveTo(-r,-3);ctx.lineTo(-r*.6,-r*.75);ctx.lineTo(r*.15,-r);ctx.lineTo(r*.95,-r*.35);ctx.lineTo(r,r*.4);ctx.lineTo(-r*.2,r*.67);ctx.closePath();ctx.fill();

function drawShip(ctx,x,y,t){
 ctx.save();ctx.translate(x,y);
 if(arc.invuln>0&&Math.floor(t*11)%2===0)ctx.globalAlpha=.45;
 ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(0,46,33,12,0,0,Math.PI*2);ctx.fill();
 if(selectedShipImage.complete&&selectedShipImage.naturalWidth>0){ctx.drawImage(selectedShipImage,-45,-64,90,125)}
 else {ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-55);ctx.lineTo(32,30);ctx.quadraticCurveTo(0,53,-32,30);ctx.closePath();ctx.fill();}
 ctx.restore();
}

function drawPort(ctx,y){
 ctx.save();ctx.translate(0,y);
 ctx.fillStyle='#efd4a0';ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(92,-30);ctx.lineTo(98,20);ctx.lineTo(0,42);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(350,-30);ctx.lineTo(440,-30);ctx.lineTo(440,42);ctx.lineTo(344,20);ctx.closePath();ctx.fill();
 ctx.fillStyle='#447f75';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(15+i*22,-4,10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(360+i*22,-4,10,0,Math.PI*2);ctx.fill()}
 rr(ctx,83,-30,14,63,3,'#9ca6a6');rr(ctx,343,-30,14,63,3,'#9ca6a6');
 ctx.fillStyle='#e7fffb';ctx.fillRect(96,29,248,5);
 rr(ctx,160,-95,120,31,10,'#064c67');ctx.fillStyle='white';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('HARBOUR',220,-74);ctx.textAlign='left';ctx.restore();
}
function drawSea(){
 const c=arc.canvas||document.getElementById('seaCanvas');if(!c)return;
 const ctx=arc.ctx||c.getContext('2d'),t=arc.elapsed||0;
 const grad=ctx.createLinearGradient(0,0,0,SEA_H);grad.addColorStop(0,'#007f9e');grad.addColorStop(1,'#20b4cc');ctx.fillStyle=grad;ctx.fillRect(0,0,SEA_W,SEA_H);
 for(let i=0;i<27;i++){
  const y=((i*44+arc.waves*90)% (SEA_H+54))-28,x=19+(i*89)%375;
  ctx.strokeStyle='rgba(226,255,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-13,y);ctx.quadraticCurveTo(x,y-5,x+13,y);ctx.stroke();
 }
 // Lane buoys and subtle navigation markers
 for(let i=0;i<6;i++){let y=((i*105+arc.waves*155)%(SEA_H+120))-65;ctx.fillStyle='#fff8dfaa';ctx.beginPath();ctx.arc(23,y,4,0,7);ctx.fill();ctx.beginPath();ctx.arc(417,y,4,0,7);ctx.fill()}
 for(const rock of arc.rocks)drawRock(ctx,rock.x,rock.y,rock.r);
 if(arc.finishing)drawPort(ctx,arc.portY);
 if(arc.active||arc.elapsed>0) {ctx.strokeStyle='#d0f6ff55';ctx.lineWidth=3;for(let n=0;n<3;n++){const yy=SHIP_Y+50+n*14+Math.sin(t*8+n)*5;ctx.beginPath();ctx.moveTo(arc.shipX-13-n*6,yy);ctx.lineTo(arc.shipX+13+n*6,yy);ctx.stroke()}}
 drawShip(ctx,arc.shipX,SHIP_Y,t);
 if(!arc.active&&!arc.elapsed){ctx.fillStyle='#023f5dbb';ctx.fillRect(0,146,440,145);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='800 25px system-ui';ctx.fillText('Ready to sail?',220,192);ctx.font='15px system-ui';ctx.fillText('20 seconds · 3 lives',220,230);ctx.fillText('Dodge the rocks!',220,256);ctx.textAlign='left'}
 if(arc.paused){ctx.fillStyle='#003e5dba';ctx.fillRect(0,0,440,490);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText('PAUSED',220,243);ctx.font='16px system-ui';ctx.fillText('Press «Resume»',220,279);ctx.textAlign='left'}
}
function refreshArcadeHud(){
 const update=(id,txt)=>{let el=document.getElementById(id);if(el)el.textContent=txt};
 update('arcTime',Math.ceil(Math.max(0,arc.time))+'s');update('arcLive','♥ '.repeat(Math.max(0,arc.lives)).trim()||'—');update('arcScore',Math.round(arc.score).toLocaleString('el-GR'));
 const p=document.getElementById('arcProgress');if(p)p.style.width=(clamp(arc.elapsed/arc.duration*100,0,100))+'%';
}
function startArcade(){
 arcadeStop();Object.assign(arc,{active:true,paused:false,score:0,lives:3,time:20,duration:20,shipX:220,targetX:null,rocks:[],last:performance.now(),spawn:0,keys:0,elapsed:0,invuln:0,finishing:false,result:'',waves:0,portY:-130,scoreTick:0});
 document.getElementById('startArc').disabled=true;document.getElementById('pauseArc').disabled=false;
 document.getElementById('arcNotice').textContent='20 seconds to the harbour. Watch out for rocks!';refreshArcadeHud();arc.raf=requestAnimationFrame(tick)
}
function toggleArcadePause(){if(!arc.active)return;arc.paused=!arc.paused;arc.keys=0;arc.targetX=null;let b=document.getElementById('pauseArc');if(b)b.textContent=arc.paused?'Resume':'Pause';arc.last=performance.now();drawSea()}
function finishArcade(won){
 arc.result=won?'win':'lose';if(won)arc.score+=Math.round(arc.lives*12+Math.max(0,arc.time)*2);
 if(arc.score>arc.highScore){arc.highScore=Math.round(arc.score);try{localStorage.setItem('gfFerryBestV5',String(arc.highScore))}catch(e){}}
 arcadeStop();navigation('ferryDone');
}
function spawnRock(){
 // One obstacle per spawn, never a wall of rocks. Safe space remains on both sides.
 const r=15+Math.random()*12,x=38+Math.random()*364;
 arc.rocks.push({x,y:-36,r,passed:false});
}
function tick(t){
 if(!arc.active)return;
 const dt=Math.min((t-arc.last)/1000,.05);arc.last=t;
 if(arc.paused){arc.raf=requestAnimationFrame(tick);return}
 arc.elapsed=Math.min(arc.duration,arc.elapsed+dt);arc.time=Math.max(0,arc.duration-arc.elapsed);arc.waves+=dt;
 arc.invuln=Math.max(0,arc.invuln-dt);
 const speed=250;
 if(arc.targetX!==null){let delta=arc.targetX-arc.shipX;arc.shipX+=clamp(delta,-speed*dt*1.75,speed*dt*1.75)}else arc.shipX+=arc.keys*speed*dt;
 arc.shipX=clamp(arc.shipX,34,406);
 let rate=1.13-arc.elapsed/arc.duration*.34;
 if(arc.elapsed<arc.duration-4){arc.spawn+=dt;if(arc.spawn>=rate){arc.spawn=0;spawnRock()}}
 const rockSpeed=115+arc.elapsed*2.35;
 for(const r of arc.rocks){
  r.y+=rockSpeed*dt;
  if(!r.passed&&r.y>SHIP_Y+45){r.passed=true;arc.score+=8;let notice=document.getElementById('arcNotice');if(notice)notice.textContent='+8 points — rock avoided!';}
  if(arc.invuln<=0&&Math.abs(r.y-SHIP_Y)<r.r+40&&Math.abs(r.x-arc.shipX)<r.r+25){r.y=SEA_H+100;arc.lives--;arc.invuln=1.25;arc.score=Math.max(0,arc.score-6);let notice=document.getElementById('arcNotice');if(notice)notice.textContent='Collision! Lost one life and 6 points.';}
 }
 arc.rocks=arc.rocks.filter(r=>r.y<SEA_H+50);
 arc.scoreTick+=dt; while(arc.scoreTick>=0.5){arc.score+=1;arc.scoreTick-=0.5}
 if(arc.elapsed>arc.duration-4){arc.finishing=true;arc.portY=-130+(arc.elapsed-(arc.duration-4))/4*520}
 refreshArcadeHud();drawSea();
 if(arc.lives<=0){finishArcade(false);return}
 if(arc.elapsed>=arc.duration){finishArcade(true);return}
 arc.raf=requestAnimationFrame(tick)
}
function hold(dir,e){if(e)e.preventDefault();arc.keys=dir;arc.targetX=null;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}
function release(e){if(e)e.preventDefault();arc.keys=0}
window.addEventListener('keydown',e=>{if(session.phase!=='ferry')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();arc.keys=e.key==='ArrowLeft'?-1:1;arc.targetX=null;}if(e.code==='Space'&&arc.active){e.preventDefault();toggleArcadePause()}});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')arc.keys=0});
window.addEventListener('blur',()=>{if(arc.active&&!arc.paused)toggleArcadePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&arc.active&&!arc.paused)toggleArcadePause()});
(function init(){const params=new URLSearchParams(location.search),invite=params.get('invite'),saved=load();trackEvent('page_view',{},invite||null);if(invite&&/^[A-Za-z0-9_-]{16,64}$/.test(invite)){session.id=invite;session.role='friend';session.remote=true;session.phase='friendJoin';saveVisitor('friend');trackEvent('invite_opened',{},invite);}else if(saved.id&&saved.role==='host'&&saved.hostAnswers){Object.assign(session,saved,{phase:'done',role:'host'});saveVisitor('host');}render()})();
